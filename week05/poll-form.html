<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Exercise</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <h2>form excercise</h2>
    <main>
        <form>
            <div class="form-item">
                <label for="Fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="form-item2">
                <label for="useremail">Email:</label>
                <input type="email" id="usermail" name="useremail" required>
            </div>
            <label for="quantity">select quantity</label>
            <select>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
            <div class="form-item column1">
                <label for="browser">Choose a browser:</label>
                <select id="browser" name="browser">
                    <option>Chrome</option>
                    <option>Firefox</option>
                    <option>Edge</option>
                    <option>brave</option>
                </select>
            </div>
            <div class="form-item column2">
                <p>What pets do you have?</p>
                <input type="checkbox" id="dog" name="pet" value="dog">
                <label for="dog">Dog</label>
                <input type="checkbox" id="cat" name="pet" value="cat">
                <label for="cat">Cat</label>
            </div>
            <label for="feedback">list the place you have lived:</label>
            <textarea id="feedback" name="feedback" rows="4" placeholder="stillwater, makurdi Nigeria"></textarea>
            <button type="submit">submit poll</button>
        </form>
    </main>
</body>
<footer>

</footer>

</html>
