<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Contact Us | White Water Rafting Company | Justine Nenger | WWD 130</title>
    <meta name="description"
        content="Get in touch with The Rapids Rafting Adventures. Find our contact information, hours, and location to plan your next outdoor experience.">
    <meta name="author" content="Justine Nenger">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <img src="images/z-therapidssplash.jpg" alt="therapidssplashheros">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Water Rafting Site</h1>

        <h2>send us a message</h2>
        <p>11086 Westside Street Abuja,<br>Nigeria</p>
        <p>phone: 09014076100</p>
        <p>email: <a href="nengerjustine@gmail.com">nengerjustine@gmail.com</a></p>
        <div>
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d8200.274005002932!2d8.54158519141294!3d7.724263541952614!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1763998885815!5m2!1sen!2sng"
                    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <section class="employee">
                <h2>We Are Here to Serve You</h2>
                <figure>
                    <img src="images/justine.jpg" alt="Justine">
                    <figcaption>CEO</figcaption>
                </figure>
                <figure>
                    <img src="images/adaku.jpg" alt="adakuRita">
                    <figcaption>Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/titus.jpg" alt="titus picture">
                    <figcaption>Human Resource Manager</figcaption>
                </figure>
            </section>
            <form>
                <label for="username">username</label>
                <input type="test" id="username" name="username" required>

                <label for="email">Email Address</label>
                <input type="email" id="emil" name="email" required>

                <p><strong>Purpose of Message:</strong></p>

                <label>
                    <input type="radio" name="purpose" value="general" required>
                    General Inquiry
                </label>

                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label>
                    <input type="radio" name="purpose" value="suggestion">
                    Website Suggestion
                </label>

                <!-- Message -->
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <!-- Newsletter Checkbox -->
                <label class="checkbox-container">
                    <input type="checkbox" name="subscribe" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">
                    Send Message
                </button>

            </form>
        </div>

    </main>

    <footer>
        <p>&copy;2025🌴White Water Rafting Company🌴 Justine Nenger</p>
        <nav class=" socialmedia">
            <a href="https://facebook.com">

            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="linkedin icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="instagram icon">
            </a>
        </nav>
    </footer>
</body>

</html>
