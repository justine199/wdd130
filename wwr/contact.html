<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Contact Us | The Rapids Rafting Adventures | Justine Nenger | WDD 130</title>
    <meta name="description"
        content="Contact The Rapids Rafting Adventures for inquiries, reservations, or suggestions.">
    <meta name="author" content="Justine Nenger">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-therapidssplash.jpg" alt="Rafting splash hero image">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>The Rapids Rafting Adventures</h1>

        <h2>Send Us a Message</h2>

        <p>11086 Westside Street Abuja,<br>Nigeria</p>
        <p>Phone: 09014076100</p>
        <p>Email: <a href="mailto:nengerjustine@gmail.com">nengerjustine@gmail.com</a></p>

        <div>
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d8200.274005002932!2d8.54158519141294!3d7.724263541952614!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1763998885815!5m2!1sen!2sng"
                    width="600" height="450" loading="lazy" allowfullscreen
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <section class="employee">
                <h2>We Are Here to Serve You</h2>

                <figure>
                    <img src="images/justine.jpg" alt="Photo of CEO Justine">
                    <figcaption>CEO</figcaption>
                </figure>

                <figure>
                    <img src="images/adaku.jpg" alt="Photo of Manager Adaku Rita">
                    <figcaption>Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/titus.jpg" alt="Photo of Titus - Human Resource Manager">
                    <figcaption>Human Resource Manager</figcaption>
                </figure>
            </section>

            <form>

                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <p><strong>Purpose of Message:</strong></p>

                <label for="purpose-general">
                    <input type="radio" id="purpose-general" name="purpose" value="general" required>
                    General Inquiry
                </label>

                <label for="purpose-reservation">
                    <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label for="purpose-suggestion">
                    <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                    Website Suggestion
                </label>
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label for="subscribe" class="checkbox-container">
                    <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit" class="btn-submit">Send Message</button>

            </form>
        </div>
    </main>

    <footer>
        <p>&copy;2025 🌴The Rapids Rafting Adventures🌴 | Justine Nenger</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram icon">
            </a>
        </nav>
    </footer>

</body>

</html>
